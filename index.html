<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f6f8;
}

header{
    background:#1f497d;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.number{
    font-size:42px;
    font-weight:bold;
    color:#1f497d;
}
</style>
</head>

<body>

<header>
    <h1>🏨 Hotel Dashboard</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Last opp filer</h2>

        <p><strong>Mews (.xlsx)</strong></p>
        <input type="file" id="mews">

        <p><strong>ResDiary (.csv)</strong></p>
        <input type="file" id="resDiary">

    </div>

    <div class="card">

        <h2>Dato</h2>

        <input type="date" id="selectedDate">

    </div>

    <div class="card">

        <h2>Dashboard</h2>

        <p>Gjester:
            <span id="guests" class="number">0</span>
        </p>

        <p>Frokost:
            <span id="breakfast" class="number">0</span>
        </p>

        <p>Lunsj:
            <span id="lunch" class="number">0</span>
        </p>

        <p>Middag:
            <span id="dinner" class="number">0</span>
        </p>

    </div>

</div>

<script>

function updateResDiary(){

    const csv =
        localStorage.getItem("resDiaryCsv");

    if(!csv){
        return;
    }

    const selectedDate =
        document.getElementById("selectedDate").value;

    const lines =
        csv.split(/\r?\n/);

    let section = "";
    let lunch = 0;
    let dinner = 0;

    for(const line of lines){

        if(line.includes('Servering,"Middag')){
            section = "dinner";
            continue;
        }

        if(line.includes('Servering,"Lunsj')){
            section = "lunch";
            continue;
        }

        if(
            line.startsWith(
                "Besøk - Dato," + selectedDate
            )
        ){

            const parts = line.split(",");

            const value =
                parseInt(parts[2]);

            if(!isNaN(value)){

                if(section === "lunch"){
                    lunch = value;
                }

                if(section === "dinner"){
                    dinner = value;
                }

            }
        }
    }

    document.getElementById("lunch").textContent =
        lunch;

    document.getElementById("dinner").textContent =
        dinner;

}

document.addEventListener(
"DOMContentLoaded",
function(){

    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    document.getElementById("selectedDate")
        .value = today;

    document
        .getElementById("selectedDate")
        .addEventListener(
            "change",
            updateResDiary
        );

    document
        .getElementById("resDiary")
        .addEventListener(
            "change",
            function(event){

                const file =
                    event.target.files[0];

                if(!file){
                    return;
                }

                const reader =
                    new FileReader();

                reader.onload =
                    function(e){

                        localStorage.setItem(
                            "resDiaryCsv",
                            e.target.result
                        );

                        updateResDiary();

                    };

                reader.readAsText(file);

            }
        );

    updateResDiary();

});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xsx.full.min.js
    <script>

document.getElementById("mews")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        try{

            const workbook = XLSX.read(
                e.target.result,
                {
                    type:"array"
                }
            );

            alert(
                "Ark funnet: " +
                workbook.SheetNames.join(", ")
            );

        }
        catch(error){

            alert(
                "Feil: " + error.message
            );

        }

    };

    reader.readAsArrayBuffer(file);

});

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Dashboard</title>

<style>

body{
    font-family: Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
}

header{
    background:#1f497d;
    color:white;
    padding:20px;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.number{
    font-size:40px;
    font-weight:bold;
    color:#1f497d;
}

input[type=date]{
    padding:8px;
}

</style>

</head>
<body>

<header>
<h1>🏨 Hotel Dashboard</h1>
</header>

<div class="container">

<div class="card">

<h2>Mews</h2>
<input type="file" id="mews">

<h2 style="margin-top:20px;">ResDiary</h2>
<input type="file" id="resDiary">

</div>

<div class="card">

<h2>Dato</h2>

<input
type="date"
id="selectedDate">

</div>

<div class="card">

<h2>Dashboard</h2>

<p>
Gjester:
<span id="guests" class="number">0</span>
</p>

<p>
Frokost:
<span id="breakfast" class="number">0</span>
</p>

<p>
Lunsj:
<span id="lunch" class="number">0</span>
</p>

<p>
Middag:
<span id="dinner" class="number">0</span>
</p>

</div>

</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.jsscript>

<script>

function updateResDiary(){

    const csv =
        localStorage.getItem("resDiaryCsv");

    if(!csv){
        return;
    }

    const selectedDate =
        document.getElementById("selectedDate").value;

    const lines = csv.split(/\r?\n/);

    let section = "";
    let lunch = 0;
    let dinner = 0;

    for(const line of lines){

        if(line.includes('Servering,"Middag')){
            section = "dinner";
            continue;
        }

        if(line.includes('Servering,"Lunsj')){
            section = "lunch";
            continue;
        }

        if(
            line.startsWith(
                "Besøk - Dato," + selectedDate
            )
        ){

            const parts = line.split(",");

            const value =
                parseInt(parts[2]);

            if(!isNaN(value)){

                if(section === "lunch"){
                    lunch = value;
                }

                if(section === "dinner"){
                    dinner = value;
                }

            }

        }

    }

    document.getElementById("lunch")
    .textContent = lunch;

    document.getElementById("dinner")
    .textContent = dinner;

}

function updateMews(){

    const mews =
        JSON.parse(
            localStorage.getItem("mewsData")
            || "{}"
        );

    const selectedDate =
        document.getElementById("selectedDate").value;

    document.getElementById("guests")
        .textContent =
        mews.guests?.[selectedDate] || 0;

    document.getElementById("breakfast")
        .textContent =
        mews.breakfast?.[selectedDate] || 0;

}

function updateDashboard(){

    updateMews();
    updateResDiary();

}

    const today = new Date();

    document.getElementById("selectedDate")
    .value =
    today.toISOString().split("T")[0];

    .getElementById("selectedDate")
    .addEventListener(
        "change",
        updateDashboard
    );

        const file =
            event.target.files[0];

            new FileReader();

        reader.onload = function(e){

            localStorage.setItem(
                "resDiaryCsv",
                e.target.result
            );

            updateDashboard();

        };

<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Hotel Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    padding:20px;
}

pre{
    background:#f4f4f4;
    padding:10px;
    overflow:auto;
    max-height:400px;
}
</style>
</head>

<body>

<h1>Hotel Dashboard</h1>

<input type="file" id="resDiary">

<h2>Filinnhold</h2>

<pre id="output"></pre>

<script>

alert("Script kjører!");

document
.getElementById("resDiary")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        document
        .getElementById("output")
        .textContent = e.target.result;

    };

    reader.readAsText(file);

});

</script>

</body>
</html>
